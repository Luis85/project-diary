name: Daily GitHub snapshot

on:
  schedule:
    # First attempt at 04:17 UTC; later runs recover an incomplete day.
    # A complete current-day bundle is checked locally and skipped.
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-github-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # Manual runs from other branches must not write to the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GITHUB_OWNER: ${{ vars.SNAPSHOT_OWNER || github.repository_owner }}
      SNAPSHOT_EVENTS_PER_REPO: ${{ vars.SNAPSHOT_EVENTS_PER_REPO || '10' }}
    steps:
      - name: Check out the default branch
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        id: runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Test the collector and diary
        id: tests
        # Native Node.js TypeScript execution needs no compiler or npm install.
        run: npm test

      - name: Collect the snapshot and create the diary
        id: capture
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            npm run snapshot -- --if-needed
          else
            npm run snapshot
          fi

      - name: Commit and push the snapshot and diary
        id: publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_DATE=$(node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const { snapshot_date: date } = JSON.parse(await readFile('data/snapshot.json', 'utf8'));
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error('Invalid snapshot date');
          console.log(date);
          NODE
          )
          git add -- data/snapshot.json "data/snapshots/${SNAPSHOT_DATE}.json" "data/diary/${SNAPSHOT_DATE}.md"
          if git diff --cached --quiet; then
            echo "No snapshot or diary changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update GitHub diary ${SNAPSHOT_DATE}"

          # A developer may push while collection is running. Rebase only;
          # conflicts or branch protection fail the job instead of overwriting work.
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not push the snapshot after three attempts. Check branch rules and workflow permissions."
              exit 1
            fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase FETCH_HEAD
          done

      - name: Link the snapshot and diary
        id: summary
        env:
          PUBLISHED_CHANGES: ${{ steps.publish.outputs.changed }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFile, readFile } from 'node:fs/promises';
          const snapshot = JSON.parse(await readFile('data/snapshot.json', 'utf8'));
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const base = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/blob/${commit}/data`;
          await appendFile(process.env.GITHUB_STEP_SUMMARY, [
            '## GitHub snapshot and diary',
            '',
            `- Account: **${snapshot.owner}**`,
            `- Public repositories: **${snapshot.repository_count}**`,
            `- Latest capture: ${snapshot.captured_at}`,
            `- [Latest JSON](${base}/snapshot.json)`,
            `- [Daily JSON archive](${base}/snapshots/${snapshot.snapshot_date}.json)`,
            `- [Obsidian diary entry](${base}/diary/${snapshot.snapshot_date}.md)`,
            '',
            process.env.PUBLISHED_CHANGES === 'true'
              ? 'The snapshot and diary changes were committed successfully.'
              : 'The daily files were already complete; no new capture was committed.',
            '',
            'Scheduled recovery runs skip complete days. Manual reruns can refresh the latest JSON; the daily archive, diary, and personal notes stay intact.',
            '',
          ].join('\n'));
          NODE

      - name: Summarize a failed run
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        shell: bash
        run: |
          {
            echo '## Snapshot workflow failed'
            echo
            echo '| Stage | Outcome |'
            echo '| --- | --- |'
            printf '| Checkout | %s |\n' "$CHECKOUT_OUTCOME"
            printf '| Node.js setup | %s |\n' "$RUNTIME_OUTCOME"
            printf '| Offline tests | %s |\n' "$TESTS_OUTCOME"
            printf '| Capture / current-day check / repair | %s |\n' "$CAPTURE_OUTCOME"
            printf '| Commit and push | %s |\n' "$PUBLISH_OUTCOME"
            printf '| Success summary | %s |\n' "$SUMMARY_OUTCOME"
            echo
            printf '[Open run logs](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            echo
            echo 'Check the failed stage above. Publication may have completed before a later summary failure; the publish outcome identifies that case.'
            echo
            echo 'Scheduled runs check again at 04:17, 10:17, 16:17, and 22:17 UTC. They skip complete days and can retry an incomplete current day. Missing past-day state cannot be reconstructed.'
            echo
            echo 'This summary does not change the failed run result. Persistent permission, validation, or branch-rule errors need attention in the run logs.'
          } >> "$GITHUB_STEP_SUMMARY"
